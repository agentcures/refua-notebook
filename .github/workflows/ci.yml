name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Build JupyterLab renderer
        run: |
          cd labextension
          npx --yes yarn@1.22.22 install --frozen-lockfile
          uv run --locked --project .. -- npx --yes yarn@1.22.22 build:prod

      - name: Ruff
        run: |
          if grep -q "^\[tool.ruff" pyproject.toml; then
            uv run ruff check refua_notebook tests
          else
            echo "No Ruff config; skipping."
          fi

      - name: Mypy
        run: |
          if grep -q "^\[tool.mypy" pyproject.toml; then
            uv run mypy refua_notebook
          else
            echo "No mypy config; skipping."
          fi

      - name: Pytest
        run: uv run pytest -q

      - name: Build and check distributions
        if: matrix.python-version == '3.12'
        run: |
          uv build
          uv run twine check dist/*
          uv pip install --reinstall --no-deps dist/*.whl
          uv run --no-sync jupyter labextension list
          REFUA_JLAB_SMOKE=1 uv run --no-sync pytest -q tests/test_jupyterlab_smoke.py
