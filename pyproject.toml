[project]
name = "refua-notebook"
version = "0.7.2"
description = "Jupyter UI extensions for drug discovery visualization - ADMET, 3D complex viewer, SMILES drawing"
authors = [{ name = "JJ Ben-Joseph", email = "jj@tensorspace.ai" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = [
    "jupyter",
    "widgets",
    "drug-discovery",
    "admet",
    "molstar",
    "smiles",
    "protein",
    "ligand",
    "cheminformatics",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ipython",
    "refua>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/agentcures/refua-notebook"
Repository = "https://github.com/agentcures/refua-notebook"
Documentation = "https://github.com/agentcures/refua-notebook#readme"
Issues = "https://github.com/agentcures/refua-notebook/issues"

[dependency-groups]
dev = [
    "pytest",
    "black",
    "pre-commit>=4.5.1",
    "ruff",
    "mypy",
    "jupyterlab",
    "ipykernel",
    "nbconvert",
    "nbformat",
    "jupyter",
    "playwright",
    "twine>=6.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["refua_notebook*"]

[tool.setuptools.package-data]
refua_notebook = ["labextension/**"]

[tool.setuptools.data-files]
"share/jupyter/labextensions/refua-notebook" = [
    "refua_notebook/labextension/package.json",
]
"share/jupyter/labextensions/refua-notebook/static" = [
    "refua_notebook/labextension/static/*",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["refua", "refua.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
